[project]
name = "karyo-jarvis"
version = "0.1.0"
description = "Jarvis mode for Karyo: local speech (OpenAI Whisper, official package and weights) driving plates through claude -p. Dev-only."
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai-whisper==20250625",  # official package, https://github.com/openai/whisper
    "numpy",
    "mcp>=2.2,<3",               # the karyo-view MCP server (stdio), same SDK as integrations/mcp
    "starlette>=0.40",           # the page's WebSocket + the MCP server's loopback HTTP
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: real Whisper + real `claude -p` (costs a model call); runs only with JARVIS_E2E=1"]
