<div class="box tone-{{tone}}">
  <div class="top"><span class="lbl">{{label}}</span><span class="val">{{prefix}}<span data-k-num="value" data-k-decimals="{{decimals}}" data-k-group="{{#if grouping}}true{{else}}false{{/if}}">{{value}}</span>{{unit}}</span></div>
  <div class="track"><div class="fill" data-k-scale="value/max"></div></div>
</div>
