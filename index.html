<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Karyo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%222%22 y=%222%22 width=%2212%22 height=%2212%22 rx=%223%22 fill=%22%23888%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root { --page-bg: #eceef1; --page-fg: #14171c; --page-muted: #5a6371; --page-rule: #d4d9df; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page-bg: #0a0c10; --page-fg: #e7eaee; --page-muted: #8c96a4; --page-rule: #232932; color-scheme: dark; } }
  :root[data-theme="dark"] { --page-bg: #0a0c10; --page-fg: #e7eaee; --page-muted: #8c96a4; --page-rule: #232932; color-scheme: dark; }
  :root[data-plate-theme^="adenine"] { --page-bg: #070c0e; --page-fg: #e3eeeb; --page-muted: #8a9d9a; --page-rule: #1a2527; color-scheme: dark; }
  body { margin: 0; background: var(--page-bg); color: var(--page-fg); font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 32px 64px; display: grid; gap: 40px; }
  header.page { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px 24px; }
  header.page h1 { margin: 0; font: 800 28px/1.1 "Archivo", system-ui, sans-serif; letter-spacing: -0.01em; }
  header.page p { margin: 4px 0 0; color: var(--page-muted); max-width: 60ch; }
  #gallery { display: grid; gap: 40px; }
  figure.entry { margin: 0; display: grid; gap: 10px; min-width: 0; }
  figcaption { display: flex; justify-content: space-between; gap: 12px; color: var(--page-muted); font-size: 13px; }
  .entry-title { color: var(--page-fg); font-weight: 600; }
  html.export body { background: #000; }
  html.export main { padding: 0; max-width: none; gap: 0; }
  html.export header.page, html.export figcaption { display: none; }
  html.export #gallery { gap: 0; }
</style>
</head>
<body>
<main>
  <header class="page">
    <div>
      <h1>Karyo</h1>
      <p>Explainer animations made of real HTML elements, with a three.js layer for wires, light and sparks. Every frame is a function of time: scrub, step or loop any of them.</p>
    </div>
    <div id="theme-slot"></div>
  </header>
  <div id="gallery"></div>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
